services:
  mysql:
    image: mysql:8.0
    container_name: mysql-chae-chae
    ports:
      - "3306:3306"
    env_file:
      - ./.env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chae-chae-network
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter-chae-chae
    volumes:
      - ./.my.cnf:/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      - mysql
    networks:
      - chae-chae-network

    restart: unless-stopped



  redis:
    image: redis:latest
    container_name: redis-chae-chae
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chae-chae-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus-chae-chae
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - chae-chae-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana-chae-chae
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - chae-chae-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    restart: unless-stopped
    depends_on:
      - prometheus


networks:
  chae-chae-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:  # Prometheus 데이터 저장용
  grafana-data:     # Grafana 데이터 저장용