name: CI/CD - MSA

on:
  pull_request:
    branches: [develop]
    paths:
      - 'msa/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'msa/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: corretto

jobs:
  ci:
    name: Test and bootJar - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - chatbot-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests and build boot jar
        working-directory: msa/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-build-only
          TOSS_SECRET_KEY: ci-dummy-toss-secret-key
          TOSS_CLIENT_KEY: ci-dummy-toss-client-key
          SLACK_WEBHOOK_URL: http://localhost/ci-dummy
          CHATBOT_BASE_URL_FAST_API: http://localhost:8000
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

  docker:
    name: Build and push image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - chatbot-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Build boot jar
        working-directory: msa/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-build-only
          TOSS_SECRET_KEY: ci-dummy-toss-secret-key
          TOSS_CLIENT_KEY: ci-dummy-toss-client-key
          SLACK_WEBHOOK_URL: http://localhost/ci-dummy
          CHATBOT_BASE_URL_FAST_API: http://localhost:8000
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: msa/${{ matrix.service }}
          file: msa/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:latest

  deploy-oci:
    name: Deploy to OCI
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: oci
    steps:
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          OCI_APP_DIR: ${{ secrets.OCI_APP_DIR }}
          INVENTORY_SERVICE_REPLICAS: ${{ vars.INVENTORY_SERVICE_REPLICAS || '1' }}
          ORDER_SERVICE_REPLICAS: ${{ vars.ORDER_SERVICE_REPLICAS || '1' }}
          PAYMENT_SERVICE_REPLICAS: ${{ vars.PAYMENT_SERVICE_REPLICAS || '1' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          envs: DOCKER_HUB_USERNAME,DOCKER_HUB_TOKEN,IMAGE_TAG,OCI_APP_DIR,INVENTORY_SERVICE_REPLICAS,ORDER_SERVICE_REPLICAS,PAYMENT_SERVICE_REPLICAS
          script: |
            set -euo pipefail

            OCI_APP_DIR="$(printf '%s' "$OCI_APP_DIR" | tr -d '\r\n')"
            cd "$OCI_APP_DIR"

            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop

            if [ -f docker-compose.yml ]; then
              COMPOSE_DIR="$PWD"
            elif [ -f msa/docker-compose.yml ]; then
              COMPOSE_DIR="$PWD/msa"
            else
              echo "docker-compose.yml not found under OCI_APP_DIR=$OCI_APP_DIR" >&2
              exit 1
            fi

            printf '%s' "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

            export DOCKER_IMAGE_PREFIX="$DOCKER_HUB_USERNAME"
            export IMAGE_TAG="$IMAGE_TAG"
            export INVENTORY_SERVICE_REPLICAS="$INVENTORY_SERVICE_REPLICAS"
            export ORDER_SERVICE_REPLICAS="$ORDER_SERVICE_REPLICAS"
            export PAYMENT_SERVICE_REPLICAS="$PAYMENT_SERVICE_REPLICAS"

            cd "$COMPOSE_DIR"
            docker compose --profile infra --profile app config --quiet
            docker compose --profile infra --profile app pull
            docker compose --profile infra --profile app up -d --no-build
            docker compose --profile infra --profile app ps
            docker image prune -f
