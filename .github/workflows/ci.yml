name: CI/CD - MSA

on:
  pull_request:
    branches: [develop]
    paths:
      - 'msa/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'msa/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: corretto

jobs:
  ci:
    name: Test and bootJar - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - coupon-service
          - delivery-service
          - chatbot-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests and build boot jar
        working-directory: msa/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-build-only
          TOSS_SECRET_KEY: ci-dummy-toss-secret-key
          TOSS_CLIENT_KEY: ci-dummy-toss-client-key
          SLACK_WEBHOOK_URL: http://localhost/ci-dummy
          CHATBOT_BASE_URL_FAST_API: http://localhost:8000
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

  docker:
    name: Build and push image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - coupon-service
          - delivery-service
          - chatbot-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Build boot jar
        working-directory: msa/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-build-only
          TOSS_SECRET_KEY: ci-dummy-toss-secret-key
          TOSS_CLIENT_KEY: ci-dummy-toss-client-key
          SLACK_WEBHOOK_URL: http://localhost/ci-dummy
          CHATBOT_BASE_URL_FAST_API: http://localhost:8000
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: msa/${{ matrix.service }}
          file: msa/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:latest

  deploy-oci:
    name: Deploy to OCI
    runs-on: [self-hosted, oci-deploy]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: oci
    steps:
      - name: Deploy with docker compose
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          GH_DEPLOY_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          OCI_APP_DIR: ${{ secrets.OCI_APP_DIR }}
          INVENTORY_SERVICE_REPLICAS: ${{ vars.INVENTORY_SERVICE_REPLICAS || '1' }}
          ORDER_SERVICE_REPLICAS: ${{ vars.ORDER_SERVICE_REPLICAS || '1' }}
          PAYMENT_SERVICE_REPLICAS: ${{ vars.PAYMENT_SERVICE_REPLICAS || '1' }}
        run: |
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            echo "git is required on the self-hosted runner" >&2
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is required on the self-hosted runner" >&2
            exit 1
          fi

          docker_cli() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo -E docker "$@"
            else
              echo "docker is not accessible by the runner user" >&2
              exit 1
            fi
          }

          if ! docker_cli compose version >/dev/null 2>&1; then
            echo "docker compose is required on the self-hosted runner" >&2
            exit 1
          fi

          OCI_APP_DIR="$(printf '%s' "$OCI_APP_DIR" | tr -d '\r\n')"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_REPO_URL="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ ! -d "$OCI_APP_DIR/.git" ]; then
            if [ -e "$OCI_APP_DIR" ]; then
              echo "OCI_APP_DIR exists but is not a git repository: $OCI_APP_DIR" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$OCI_APP_DIR")"
            git clone --branch develop --single-branch "$AUTH_REPO_URL" "$OCI_APP_DIR"
            git -C "$OCI_APP_DIR" remote set-url origin "$REPO_URL"
          fi

          cd "$OCI_APP_DIR"

          git checkout develop
          git pull --ff-only "$AUTH_REPO_URL" develop
          git remote set-url origin "$REPO_URL"

          if [ -f docker-compose.yml ]; then
            COMPOSE_DIR="$PWD"
          elif [ -f msa/docker-compose.yml ]; then
            COMPOSE_DIR="$PWD/msa"
          else
            echo "docker-compose.yml not found under OCI_APP_DIR=$OCI_APP_DIR" >&2
            exit 1
          fi

          cd "$COMPOSE_DIR"

          REQUIRED_ENV_FILES=(
            .env.user.mysql
            .env.product.mysql
            .env.inventory.mysql
            .env.order.mysql
            .env.chatbot.mysql
            .env.payment
            .env.coupon.mysql
            .env.delivery.mysql
            env.secret.key
          )

          MISSING_ENV_FILES=()
          for env_file in "${REQUIRED_ENV_FILES[@]}"; do
            if [ ! -f "$env_file" ]; then
              MISSING_ENV_FILES+=("$env_file")
            fi
          done

          if [ "${#MISSING_ENV_FILES[@]}" -gt 0 ]; then
            printf 'Missing required compose env files under %s:\n' "$COMPOSE_DIR" >&2
            printf ' - %s\n' "${MISSING_ENV_FILES[@]}" >&2
            exit 1
          fi

          printf '%s' "$DOCKER_HUB_TOKEN" | docker_cli login -u "$DOCKER_HUB_USERNAME" --password-stdin

          export DOCKER_IMAGE_PREFIX="$DOCKER_HUB_USERNAME"
          export IMAGE_TAG="$IMAGE_TAG"
          export INVENTORY_SERVICE_REPLICAS="$INVENTORY_SERVICE_REPLICAS"
          export ORDER_SERVICE_REPLICAS="$ORDER_SERVICE_REPLICAS"
          export PAYMENT_SERVICE_REPLICAS="$PAYMENT_SERVICE_REPLICAS"

          docker_cli compose --profile infra --profile app config --quiet
          docker_cli compose --profile infra --profile app pull
          docker_cli compose --profile infra --profile app up -d --no-build
          docker_cli compose --profile infra --profile app ps
          docker_cli image prune -f
