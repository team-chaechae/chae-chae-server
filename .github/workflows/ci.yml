name: CI - Build and Push Docker Image

on:
  push:
    branches: [ main, develop, feat/77/setup-to-msa ]
  pull_request:
    branches: [ develop ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      eureka-server: ${{ steps.filter.outputs.eureka-server }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      user-service: ${{ steps.filter.outputs.user-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      chatbot-service: ${{ steps.filter.outputs.chatbot-service }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            eureka-server:
              - 'msa/eureka-server/**'
            api-gateway:
              - 'msa/api-gateway/**'
            user-service:
              - 'msa/user-service/**'
            product-service:
              - 'msa/product-service/**'
            inventory-service:
              - 'msa/inventory-service/**'
            order-service:
              - 'msa/order-service/**'
            chatbot-service:
              - 'msa/chatbot-service/**'

  build-eureka-server:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.eureka-server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/eureka-server
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/eureka-server
          file: msa/eureka-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/eureka-server:${{ github.sha }}

  build-api-gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/api-gateway
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/api-gateway
          file: msa/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/api-gateway:${{ github.sha }}

  build-user-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/user-service
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/user-service
          file: msa/user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/user-service:${{ github.sha }}

  build-product-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.product-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/product-service
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/product-service
          file: msa/product-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/product-service:${{ github.sha }}

  build-inventory-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.inventory-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/inventory-service
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/inventory-service
          file: msa/inventory-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/inventory-service:${{ github.sha }}

  build-order-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.order-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/order-service
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/order-service
          file: msa/order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/order-service:${{ github.sha }}

  build-chatbot-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.chatbot-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Build
        run: |
          cd msa/chatbot-service
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: msa/chatbot-service
          file: msa/chatbot-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-service:${{ github.sha }}
