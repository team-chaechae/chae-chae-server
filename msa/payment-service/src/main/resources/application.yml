spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3312/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 15000
        linger.ms: 5
        batch.size: 32768
        compression.type: lz4
        retries: 0
        max.in.flight.requests.per.connection: 1

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:${OTEL_COLLECTOR_PORT:4318}/v1/traces

logging:
  file:
    name: logs/payment.log
  level:
    root: INFO
    com.project.paymentservice: INFO

loki:
  url: http://${LOKI_HOST:localhost}:${LOKI_PORT:3100}/loki/api/v1/push

# Kafka 백프레셔 설정
kafka:
  backpressure:
    max-permits: 50
    core-pool-size: 5
    max-pool-size: 20
    acquire-timeout-ms: 30000

# Slack 알림 설정
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}
  alert:
    enabled: ${SLACK_ALERT_ENABLED:true}

# DLQ (Dead Letter Queue) 설정
dlq:
  enabled: true
  topic-suffix: .dlq
  max-retries: 3
  retry-interval-ms: 1000
  retry-multiplier: 2.0
  alert-enabled: true
  db-enabled: true
  technical-replay:
    enabled: true
    schedule-cron: "0 */5 * * * ?"
    batch-size: 100
    max-replay-retries: 3
  cleanup:
    enabled: true
    schedule-cron: "0 0 3 * * ?"
    retention-days: 30
  alert-threshold:
    pending-count: 100
    check-cron: "0 0 * * * ?"

# Outbox Relay 설정
outbox:
  relay:
    interval-ms: 120000
    batch-size: 50
    threshold-minutes: 5
    max-retries: 3
    cleanup-days: 7
    cleanup-cron: "0 0 3 * * ?"
