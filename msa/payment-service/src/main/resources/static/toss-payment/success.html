<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 승인 중</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2129;
      background: #f6f7f9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      background: #ffffff;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(29, 33, 41, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.3;
    }

    p {
      margin: 8px 0;
      color: #5c6675;
      line-height: 1.5;
    }

    pre {
      overflow: auto;
      margin: 16px 0 0;
      padding: 14px;
      border-radius: 6px;
      background: #111827;
      color: #f9fafb;
      font-size: 13px;
      line-height: 1.5;
    }

    a {
      color: #2164d7;
      font-weight: 700;
    }
  </style>
</head>
<body>
<main>
  <h1 id="title">결제 승인 중</h1>
  <p id="message">토스페이먼츠 결제 인증 결과를 서버에서 승인하고 있습니다.</p>
  <p><a href="/toss-payment/index.html">결제창으로 돌아가기</a></p>
  <pre id="result"></pre>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = document.querySelector("#title");
  const message = document.querySelector("#message");
  const result = document.querySelector("#result");

  confirmPayment();

  async function confirmPayment() {
    const paymentKey = params.get("paymentKey");
    const orderId = params.get("orderId");
    const amount = Number(params.get("amount"));
    const salesId = Number(params.get("salesId"));

    if (!paymentKey || !orderId || !Number.isInteger(amount) || !Number.isInteger(salesId)) {
      markFailed("결제 승인에 필요한 파라미터가 부족합니다.");
      return;
    }

    try {
      const response = await fetch("/api/payment/toss/confirm", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          paymentKey,
          orderId,
          salesId,
          amount
        })
      });
      const body = await response.json();

      if (!response.ok) {
        throw new Error(body.message || "서버 결제 승인에 실패했습니다.");
      }

      title.textContent = "결제가 완료되었습니다.";
      message.textContent = `salesId ${salesId} 결제가 승인되었습니다.`;
      result.textContent = JSON.stringify(body, null, 2);
    } catch (error) {
      markFailed(error.message || "서버 결제 승인에 실패했습니다.");
    }
  }

  function markFailed(errorMessage) {
    title.textContent = "결제 승인 실패";
    message.textContent = errorMessage;
    result.textContent = JSON.stringify(Object.fromEntries(params.entries()), null, 2);
  }
</script>
</body>
</html>
