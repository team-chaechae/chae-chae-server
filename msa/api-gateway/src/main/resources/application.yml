spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              type: elastic
              max-connections: 500
              acquire-timeout: 10000
            connect-timeout: 5000
            response-timeout: 30s
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            - id: sales-service
              uri: lb://order-service
              predicates:
                - Path=/api/sales/**

            - id: chatbot-service
              uri: lb://chatbot-service
              predicates:
                - Path=/api/chatbot/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always

logging:
  file:
    name: logs/gateway.log
  level:
    root: INFO
    com.project.apigateway: INFO
    org.springframework.cloud.gateway: INFO

jwt:
  secret-key: ${JWT_SECRET_KEY}
