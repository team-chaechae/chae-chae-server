
name: msa-chae-chae

services:
  # MySQL Databases
  mysql-user:
    image: mysql:8.0
    container_name: msa-mysql-user
    env_file:
      - env.mysql.user
    ports:
      - "3307:3306"
    volumes:
      - msa-mysql-user-data:/var/lib/mysql
    networks:
      - msa-network

  mysql-product:
    image: mysql:8.0
    container_name: msa-mysql-product
    env_file:
      - env.mysql.product
    ports:
      - "3308:3306"
    volumes:
      - msa-mysql-product-data:/var/lib/mysql
    networks:
      - msa-network

  mysql-inventory:
    image: mysql:8.0
    container_name: msa-mysql-inventory
    env_file:
      - env.mysql.inventory
    ports:
      - "3309:3306"
    volumes:
      - msa-mysql-inventory-data:/var/lib/mysql
    networks:
      - msa-network

  mysql-order:
    image: mysql:8.0
    container_name: msa-mysql-order
    env_file:
      - env.mysql.order
    ports:
      - "3310:3306"
    volumes:
      - msa-mysql-order-data:/var/lib/mysql
    networks:
      - msa-network

  mysql-chatbot:
    image: mysql:8.0
    container_name: msa-mysql-chatbot
    env_file:
      - env.mysql.chatbot
    ports:
      - "3311:3306"
    volumes:
      - msa-mysql-chatbot-data:/var/lib/mysql
    networks:
      - msa-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6380:6379"
    networks:
      - msa-network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: msa-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    networks:
      - msa-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: msa-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - msa-network

  # MySQL Exporters
  mysql-exporter-user:
    image: prom/mysqld-exporter:v0.14.0
    container_name: msa-mysql-exporter-user
    environment:
      DATA_SOURCE_NAME: "root:password@(mysql-user:3306)/user_db"
    ports:
      - "9104:9104"
    depends_on:
      - mysql-user
    networks:
      - msa-network

  mysql-exporter-product:
    image: prom/mysqld-exporter:v0.14.0
    container_name: msa-mysql-exporter-product
    environment:
      DATA_SOURCE_NAME: "root:password@(mysql-product:3306)/product_db"
    ports:
      - "9105:9104"
    depends_on:
      - mysql-product
    networks:
      - msa-network

  mysql-exporter-inventory:
    image: prom/mysqld-exporter:v0.14.0
    container_name: msa-mysql-exporter-inventory
    environment:
      DATA_SOURCE_NAME: "root:password@(mysql-inventory:3306)/inventory_db"
    ports:
      - "9106:9104"
    depends_on:
      - mysql-inventory
    networks:
      - msa-network

  mysql-exporter-order:
    image: prom/mysqld-exporter:v0.14.0
    container_name: msa-mysql-exporter-order
    environment:
      DATA_SOURCE_NAME: "root:password@(mysql-order:3306)/order_db"
    ports:
      - "9107:9104"
    depends_on:
      - mysql-order
    networks:
      - msa-network

  mysql-exporter-chatbot:
    image: prom/mysqld-exporter:v0.14.0
    container_name: msa-mysql-exporter-chatbot
    environment:
      DATA_SOURCE_NAME: "root:password@(mysql-chatbot:3306)/chatbot_db"
    ports:
      - "9108:9104"
    depends_on:
      - mysql-chatbot
    networks:
      - msa-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: msa-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9122:9121"
    depends_on:
      - redis
    networks:
      - msa-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: msa-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - mysql-exporter-user
      - mysql-exporter-product
      - mysql-exporter-inventory
      - mysql-exporter-order
      - mysql-exporter-chatbot
      - redis-exporter
    networks:
      - msa-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: msa-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - msa-network

volumes:
  msa-mysql-user-data:
  msa-mysql-product-data:
  msa-mysql-inventory-data:
  msa-mysql-order-data:
  msa-mysql-chatbot-data:

networks:
  msa-network:
    driver: bridge
