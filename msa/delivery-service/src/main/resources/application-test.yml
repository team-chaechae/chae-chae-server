spring:
  datasource:
    url: jdbc:h2:mem:delivery_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false
