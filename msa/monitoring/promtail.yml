server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: msa-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: msa-logs
          __path__: /logs/**/*.log

    pipeline_stages:
      # JSON 파싱
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            thread: thread_name
            trace_id: traceId
            span_id: spanId
            app: app

      # 라벨 설정
      - labels:
          level:
          app:
          logger:

      # 최종 로그 라인 (message만)
      - output:
          source: message
