global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Services
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']
    relabel_configs:
      - target_label: instance
        replacement: 'eureka-server'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
    relabel_configs:
      - target_label: instance
        replacement: 'api-gateway'

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
    relabel_configs:
      - target_label: instance
        replacement: 'user-service'

  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
    relabel_configs:
      - target_label: instance
        replacement: 'product-service'

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
    relabel_configs:
      - target_label: instance
        replacement: 'inventory-service'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
    relabel_configs:
      - target_label: instance
        replacement: 'order-service'

  - job_name: 'chatbot-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
    relabel_configs:
      - target_label: instance
        replacement: 'chatbot-service'

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8086']
    relabel_configs:
      - target_label: instance
        replacement: 'payment-service'

  # MySQL Exporters (per service database)
  - job_name: 'mysql-user'
    static_configs:
      - targets: ['mysql-exporter-user:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-user'

  - job_name: 'mysql-product'
    static_configs:
      - targets: ['mysql-exporter-product:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-product'

  - job_name: 'mysql-inventory'
    static_configs:
      - targets: ['mysql-exporter-inventory:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-inventory'

  - job_name: 'mysql-order'
    static_configs:
      - targets: ['mysql-exporter-order:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-order'

  - job_name: 'mysql-chatbot'
    static_configs:
      - targets: ['mysql-exporter-chatbot:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-chatbot'

  - job_name: 'mysql-payment'
    static_configs:
      - targets: ['mysql-exporter-payment:9104']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'mysql-payment'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'redis'

  # Kafka Exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
    scrape_interval: 5s
    metrics_path: /metrics
    relabel_configs:
      - target_label: instance
        replacement: 'kafka'