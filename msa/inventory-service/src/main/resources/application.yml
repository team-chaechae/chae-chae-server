spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3309/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
      repositories:
        bootstrap-mode: deferred
  data:
    redis:
      sentinel:
        master: mymaster
        nodes:
          - ${REDIS_SENTINEL_1:localhost}:${REDIS_SENTINEL_PORT_1:26379}
          - ${REDIS_SENTINEL_2:localhost}:${REDIS_SENTINEL_PORT_2:26380}
          - ${REDIS_SENTINEL_3:localhost}:${REDIS_SENTINEL_PORT_3:26381}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:${OTEL_COLLECTOR_PORT:4328}/v1/traces

logging:
  file:
    name: logs/inventory.log
  level:
    root: INFO
    com.project.inventoryservice: INFO
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.pool.HikariPool: DEBUG

loki:
  url: http://${LOKI_HOST:localhost}:${LOKI_PORT:3100}/loki/api/v1/push

# Saga 설정
saga:
  timeout:
    reservation-ttl-seconds: 900  # Redis 예약 TTL (15분 = 900초)

# Kafka 백프레셔 설정 (BlockingThreadPoolExecutor)
kafka:
  backpressure:
    max-permits: 50           # Semaphore 동시 처리 최대 수 (Runtime 조절 가능)
    core-pool-size: 5         # ThreadPool 코어 스레드 수
    max-pool-size: 20         # ThreadPool 최대 스레드 수
    acquire-timeout-ms: 30000 # Semaphore acquire 타임아웃 (30초)
