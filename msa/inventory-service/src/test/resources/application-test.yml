spring:
  application:
    name: inventory-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: inventory-test-group
      auto-offset-reset: earliest

# Redisson - 테스트용 (환경변수 오버라이드)
REDIS_HOST: localhost
REDIS_PORT: 6380

eureka:
  client:
    enabled: false

logging:
  level:
    root: INFO
    com.project.inventoryservice: DEBUG
    org.hibernate.SQL: DEBUG
